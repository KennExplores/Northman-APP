<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>The Northman - Warrior Training</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap');
    
    body { 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
    }
    
    .viking-title {
      font-family: 'Cinzel', serif;
      letter-spacing: 2px;
    }
    
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .viking-gradient {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #1e1b4b 100%);
    }
    
    .rune-border {
      border: 2px solid #64748b;
      border-image: repeating-linear-gradient(
        45deg,
        #64748b,
        #64748b 10px,
        transparent 10px,
        transparent 20px
      ) 1;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ============================================
    // PROGRAM DATA
    // ============================================
    
    const PROGRAM_START_DATE = new Date('2026-06-01'); // Sunday, June 1st 2026
    
    const calculateCurrentWeek = () => {
      const today = new Date();
      const diffTime = today - PROGRAM_START_DATE;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      const weekNumber = Math.floor(diffDays / 7) + 1;
      
      // If before start date, show Week 1
      if (weekNumber < 1) return 1;
      // Cap at Week 24
      if (weekNumber > 24) return 24;
      return weekNumber;
    };
    
    const WORKOUTS = {
      monday: {
        name: "Upper Strength (Horizontal)",
        focus: "Chest Thickness & Back Development",
        emoji: "⚔️",
        gym: "Anytime Fitness Stellar",
        exercises: [
          { name: "Barbell Bench Press", sets: 4, reps: "6-8", type: "compound", note: "Warrior strength base" },
          { name: "Barbell Bent-Over Row", sets: 4, reps: "6-8", type: "compound", note: "Back thickness" },
          { name: "Incline Dumbbell Press", sets: 3, reps: "8-10", type: "accessory" },
          { name: "Seal Rows (Machine or DB)", sets: 3, reps: "10-12", type: "accessory" },
          { name: "Cable Flyes", sets: 3, reps: "12-15", type: "isolation" },
          { name: "Cable Rows (High-to-Low)", sets: 3, reps: "12-15", type: "isolation" },
          { name: "Chest Dips (if available)", sets: 2, reps: "8-12", type: "accessory" },
        ]
      },
      tuesday: {
        name: "Lower Power",
        focus: "Lean Leg Strength & Athletic Development",
        emoji: "🦵",
        gym: "Anytime Fitness Stellar",
        exercises: [
          { name: "Barbell Back Squat", sets: 4, reps: "6-8", type: "compound", note: "Foundation strength" },
          { name: "Barbell Deadlift", sets: 4, reps: "5-6", type: "compound", note: "Posterior chain power" },
          { name: "Bulgarian Split Squat", sets: 3, reps: "8-10/leg", type: "accessory" },
          { name: "Single-Leg Romanian Deadlift", sets: 3, reps: "10/leg", type: "accessory" },
          { name: "Walking Lunges (weighted)", sets: 3, reps: "12/leg", type: "accessory" },
          { name: "Leg Curl (Machine)", sets: 2, reps: "12-15", type: "isolation", note: "Hamstring definition" },
        ]
      },
      wednesday: {
        name: "Upper Hypertrophy (Vertical)",

        emoji: "💪",
        gym: "Anytime Fitness Stellar",
        exercises: [
          { name: "Barbell Overhead Press", sets: 4, reps: "6-8", type: "compound", note: "Boulder shoulders" },
          { name: "Weighted Pull-Ups or Lat Pulldown", sets: 4, reps: "8-10", type: "compound", note: "Back width" },
          { name: "Dumbbell Lateral Raises", sets: 4, reps: "12-15", type: "accessory", note: "Shoulder caps (CRITICAL)" },
          { name: "Cable Upright Rows", sets: 3, reps: "12-15", type: "accessory" },
          { name: "Wide-Grip Lat Pulldown", sets: 3, reps: "10-12", type: "accessory", note: "V-taper width" },
          { name: "Rear Delt Machine Flyes", sets: 3, reps: "12-15", type: "isolation", note: "Back thickness" },
          { name: "Shrugs (Barbell or DB)", sets: 3, reps: "12-15", type: "accessory" },
        ]
      },
      thursday: {
        name: "Lower Hypertrophy",
        focus: "Lean, Defined Leg Development",
        emoji: "🏔️",
        gym: "Anytime Fitness Stellar",
        exercises: [
          { name: "Dumbbell Step-Ups (heavy)", sets: 4, reps: "10-12/leg", type: "compound" },
          { name: "Machine Leg Press", sets: 3, reps: "10-12", type: "compound", note: "Clean reps, full range" },
          { name: "Leg Extensions", sets: 3, reps: "12-15", type: "isolation", note: "Quad definition" },
          { name: "Single-Leg Leg Curl", sets: 3, reps: "12-15/leg", type: "isolation" },
          { name: "Calf Raises (Standing)", sets: 3, reps: "15-20", type: "accessory" },
          { name: "Ab Wheel Rollout", sets: 2, reps: "10-15", type: "core" },
        ]
      },
      friday: {
        name: "Upper Definition (Arms & Shoulders)",
        focus: "SKARSGÅRD ARM & SHOULDER DEFINITION",
        emoji: "🔥",
        gym: "Anytime Fitness Stellar",
        exercises: [
          { name: "Dumbbell Overhead Press", sets: 3, reps: "8-10", type: "compound" },
          { name: "Dumbbell Lateral Raises", sets: 4, reps: "12-15", type: "accessory", note: "Shoulder pop" },
          { name: "Cable Bicep Curls (rope or bar)", sets: 3, reps: "12-15", type: "isolation", note: "Arm definition" },
          { name: "Cable Tricep Pushdowns", sets: 3, reps: "12-15", type: "isolation" },
          { name: "Hammer Curls (Dumbbell)", sets: 3, reps: "12-15", type: "accessory" },
          { name: "Overhead Tricep Extension (DB or cable)", sets: 3, reps: "12-15", type: "accessory" },
          { name: "Cable Face Pulls", sets: 3, reps: "15-20", type: "mobility", note: "Shoulder health" },
          { name: "Concentration Curls", sets: 2, reps: "15", type: "isolation", note: "Final pump" },
        ]
      },
      saturday: {
        name: "Warrior Conditioning (Hike/Ruck/Prep)",
        focus: "Northman Endurance & Solo Camping Prep",
        emoji: "🥾",
        gym: "Outdoor - Canberra Nature",
        exercises: [
          { name: "Weighted Ruck (10-20kg)", sets: 1, reps: "60-90min", type: "cardio", note: "Build to 20kg over 6 months" },
          { name: "Hiking (Local trails near Canberra)", sets: 1, reps: "45-120min", type: "cardio", note: "Scout camping routes" },
          { name: "Camping Prep Work (if camping weekend)", sets: 1, reps: "full day", type: "training", note: "Setup, wood gathering, survival skills" },
        ]
      },
      sunday: {
        name: "Recovery & Warrior Preparation",
        focus: "Rest, Mobility & Mental Fortitude",
        emoji: "🛡️",
        exercises: [
          { name: "Easy Walk or Light Hike", sets: 1, reps: "20-30min", type: "recovery" },
          { name: "Deep Stretching", sets: 1, reps: "20min", type: "mobility" },
          { name: "Foam Rolling (full body)", sets: 1, reps: "15min", type: "mobility" },
          { name: "Cold Exposure (cold shower/plunge if available)", sets: 1, reps: "2-3min", type: "warrior", note: "Northman mental toughness" },
          { name: "Meal Prep for Week", sets: 1, reps: "60-90min", type: "nutrition", note: "Stay locked in" },
        ]
      }
    };

    const MEAL_PLAN = {
      meal1: {
        name: "Pre-Workout Snack",
        time: "4:10am",
        defaultCalories: 245,
        items: [
          { id: '1a', name: 'Rice cakes', amount: '2' },
          { id: '1b', name: 'Banana', amount: '1 medium' },
          { id: '1c', name: 'Peanut butter', amount: '0.5 tbsp' }
        ]
      },
      meal2: {
        name: "Breakfast",
        time: "6:15am",
        defaultCalories: 360,
        items: [
          { id: '2a', name: 'Whole eggs', amount: '2' },
          { id: '2b', name: 'Egg whites', amount: '200ml' },
          { id: '2c', name: 'Wholemeal toast', amount: '2 slices' },
          { id: '2d', name: 'Hot sauce', amount: 'to taste' }
        ]
      },
      meal3: {
        name: "Mid-Morning Snack",
        time: "9:00am",
        defaultCalories: 480,
        items: [
          { id: '3a', name: 'Greek yogurt', amount: '150g' },
          { id: '3b', name: 'Rolled oats', amount: '80g' },
          { id: '3c', name: 'Blueberries', amount: '40g' },
          { id: '3d', name: 'Honey', amount: '1 tbsp' }
        ]
      },
      lunchCurry: {
        name: "Lunch - Green Curry",
        time: "12:30pm",
        defaultCalories: 800,
        macros: { phase1: { cal: 800, protein: 62, carbs: 88, fat: 16 }, phase2: { cal: 1035, protein: 75.6, carbs: 112.5, fat: 21.5 } },
        items: [
          { id: '4a', name: 'Chicken breast (grilled)', amount: '220g (Phase 1) / 270g (Phase 2)' },
          { id: '4b', name: 'Light coconut milk', amount: '120ml (P1) / 150ml (P2)' },
          { id: '4c', name: 'Jasmine rice (cooked)', amount: '250g (P1) / 350g (P2)' },
          { id: '4d', name: 'Mixed vegetables (broccoli, capsicum, etc)', amount: '150g' }
        ]
      },
      lunchNachos: {
        name: "Lunch - Nachos",
        time: "12:30pm",
        defaultCalories: 780,
        macros: { phase1: { cal: 780, protein: 60, carbs: 92, fat: 24 }, phase2: { cal: 1029, protein: 74.4, carbs: 115, fat: 30 } },
        items: [
          { id: '4e', name: 'Cornchips', amount: '40g (P1) / 50g (P2)' },
          { id: '4f', name: 'Extra lean beef mince (cooked)', amount: '250g (P1) / 300g (P2)' },
          { id: '4g', name: 'Black beans', amount: '200g (P1) / 200g (P2)' },
          { id: '4i', name: 'Lactose-free Bega cheese', amount: '30g' },
          { id: '4j', name: 'Light sour cream', amount: '30g' },
          { id: '4k', name: 'Hot sauce', amount: 'to taste' }
        ]
      },
      meal5: {
        name: "Afternoon Snack",
        time: "3:30pm",
        defaultCalories: 280,
        items: [
          { id: '5a', name: 'Greek yogurt', amount: '150g' },
          { id: '5b', name: 'Banana', amount: '1 medium' },
          { id: '5c', name: 'Rolled oats', amount: '30g' }
        ]
      },
      meal6: {
        name: "Dinner",
        time: "6:00pm",
        defaultCalories: 515,
        items: [
          { id: '6a', name: 'Grilled chicken breast', amount: '220g' },
          { id: '6b', name: 'Sweet potato', amount: '250g' },
          { id: '6c', name: 'Steamed vegetables', amount: '150g' },
          { id: '6d', name: 'Olive oil', amount: '0.5 tbsp' }
        ]
      }
    };

    // ============================================
    // STORAGE (localStorage for GitHub Pages)
    // ============================================
    
    const storage = {
      get(key) {
        try {
          const data = localStorage.getItem(key);
          return data ? JSON.parse(data) : null;
        } catch (e) {
          console.log('Storage get error:', e);
          return null;
        }
      },
      
      set(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (e) {
          console.error('Storage set error:', e);
          return false;
        }
      }
    };

    // ============================================
    // MAIN APP
    // ============================================
    
    function NorthmanApp() {
      const [activeTab, setActiveTab] = useState('home');
      const [currentWeek, setCurrentWeek] = useState(calculateCurrentWeek());
      const [workoutHistory, setWorkoutHistory] = useState({});
      const [measurements, setMeasurements] = useState([]);
      const [photos, setPhotos] = useState([]);
      const [mealChecks, setMealChecks] = useState({});
      const [customizedMeals, setCustomizedMeals] = useState({});
      const [currentDay, setCurrentDay] = useState('monday');
      const [isLoading, setIsLoading] = useState(true);
      const [lunchChoice, setLunchChoice] = useState('curry'); // 'curry' or 'nachos'

      useEffect(() => {
        loadData();
      }, []);

      const loadData = () => {
        try {
          const week = storage.get('currentWeek');
          const history = storage.get('workoutHistory');
          const measures = storage.get('measurements');
          const pics = storage.get('photos');
          const meals = storage.get('mealChecks');
          const customMeals = storage.get('customizedMeals');
          
          // Use stored week if available, otherwise calculate based on start date
          if (week && typeof week === 'number') {
            setCurrentWeek(week);
          } else {
            setCurrentWeek(calculateCurrentWeek());
          }
          
          if (history && typeof history === 'object') setWorkoutHistory(history);
          if (Array.isArray(measures)) setMeasurements(measures);
          if (Array.isArray(pics)) setPhotos(pics);
          if (meals && typeof meals === 'object') setMealChecks(meals);
          if (customMeals && typeof customMeals === 'object') setCustomizedMeals(customMeals);
        } catch (error) {
          console.log('Error loading data:', error);
        } finally {
          setIsLoading(false);
        }
      };

      const saveData = (key, value, setter) => {
        setter(value);
        storage.set(key, value);
      };

      const getCurrentPhase = () => {
        if (currentWeek <= 8) return "Foundation";
        if (currentWeek <= 16) return "Hypertrophy";
        return "Refinement";
      };

      if (isLoading) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center">
            <div className="text-center">
              <div className="text-6xl mb-4">⚔️</div>
              <div className="viking-title text-2xl text-amber-400 font-bold">Loading...</div>
            </div>
          </div>
        );
      }

      // ============================================
      // HOME TAB
      // ============================================
      
      const HomeTab = () => {
        const today = new Date().toLocaleDateString('en-US', { weekday: 'long' }).toLowerCase();
        const todayWorkout = WORKOUTS[today];
        const progress = Math.round((currentWeek / 24) * 100);
        
        const daysUntilStart = Math.ceil((PROGRAM_START_DATE - new Date()) / (1000 * 60 * 60 * 24));
        const daysSinceStart = Math.floor((new Date() - PROGRAM_START_DATE) / (1000 * 60 * 60 * 24));
        const isBeforeStart = daysUntilStart > 0;

        return (
          <div className="p-4 space-y-4 pb-20">
            {/* Viking Header */}
            <div className="viking-gradient rounded-lg p-6 text-center relative overflow-hidden">
              <div className="absolute inset-0 opacity-10">
                <div className="text-6xl">⚔️🛡️⚡</div>
              </div>
              <h1 className="viking-title text-4xl font-black text-amber-400 mb-2 relative z-10">
                THE NORTHMAN
              </h1>
              <p className="text-slate-300 text-sm mb-4 relative z-10">Warrior Physique Protocol</p>
              
              <div className="bg-slate-800/50 rounded-lg p-4 relative z-10">
                <div className="flex justify-between items-center mb-2">
                  <span className="text-slate-400 text-xs">WEEK {currentWeek}/24</span>
                  <span className="text-amber-400 text-xs font-bold">{getCurrentPhase()}</span>
                </div>
                <div className="w-full bg-slate-700 rounded-full h-2">
                  <div 
                    className="bg-gradient-to-r from-amber-600 to-amber-400 h-2 rounded-full transition-all"
                    style={{ width: `${progress}%` }}
                  />
                </div>
                <div className="flex justify-between items-center mt-2">
                  <p className="text-slate-400 text-xs">{progress}% Complete</p>
                  {isBeforeStart ? (
                    <p className="text-amber-400 text-xs font-bold">
                      Starts in {daysUntilStart} days 🗓️
                    </p>
                  ) : (
                    <p className="text-amber-400 text-xs">
                      Day {daysSinceStart + 1} of journey
                    </p>
                  )}
                </div>
              </div>
            </div>

            {/* Today's Battle */}
            {todayWorkout && (
              <div className="bg-slate-800 rounded-lg p-4 border-2 border-amber-600/30">
                <div className="flex items-center gap-2 mb-2">
                  <span className="text-3xl">{todayWorkout.emoji}</span>
                  <div>
                    <div className="text-xs text-amber-400 font-bold">TODAY'S BATTLE</div>
                    <h3 className="text-white font-bold">{todayWorkout.name}</h3>
                  </div>
                </div>
                <p className="text-slate-400 text-sm mb-3">{todayWorkout.focus}</p>
                <button
                  onClick={() => {
                    setCurrentDay(today);
                    setActiveTab('workouts');
                  }}
                  className="w-full bg-gradient-to-r from-amber-600 to-amber-500 text-white py-3 rounded-lg font-bold hover:from-amber-700 hover:to-amber-600"
                >
                  BEGIN TRAINING ⚔️
                </button>
              </div>
            )}

            {/* Quick Stats */}
            <div className="grid grid-cols-3 gap-3">
              <div className="bg-slate-800 rounded-lg p-3 text-center border border-slate-700">
                <div className="text-2xl font-bold text-amber-400">
                  {workoutHistory ? Object.keys(workoutHistory).length : 0}
                </div>
                <div className="text-xs text-slate-400">Battles Won</div>
              </div>
              <div className="bg-slate-800 rounded-lg p-3 text-center border border-slate-700">
                <div className="text-2xl font-bold text-amber-400">
                  {measurements ? measurements.length : 0}
                </div>
                <div className="text-xs text-slate-400">Measurements</div>
              </div>
              <div className="bg-slate-800 rounded-lg p-3 text-center border border-slate-700">
                <div className="text-2xl font-bold text-amber-400">
                  {photos ? photos.length : 0}
                </div>
                <div className="text-xs text-slate-400">Progress Pics</div>
              </div>
            </div>

            {/* Today's Fuel */}
            <div className="bg-slate-800 rounded-lg p-4 border border-slate-700">
              <h3 className="text-amber-400 font-bold mb-3 flex items-center gap-2">
                <span>🍖</span> TODAY'S FUEL
              </h3>
              
              {/* Daily Targets & Progress */}
              <div className="bg-slate-900 rounded-lg p-3 mb-4">
                <div className="text-xs text-slate-400 mb-2">
                  {currentWeek <= 16 ? '⚔️ PHASE 1 TARGETS' : '💪 PHASE 2 TARGETS'}
                </div>
                <div className="grid grid-cols-2 gap-2 text-xs mb-3">
                  <div>
                    <div className="text-slate-400">Calories</div>
                    <div className="text-amber-400 font-bold">{currentWeek <= 16 ? '2,860' : '3,385'} cal</div>
                  </div>
                  <div>
                    <div className="text-slate-400">Protein</div>
                    <div className="text-amber-400 font-bold">{currentWeek <= 16 ? '230g' : '240g'}</div>
                  </div>
                  <div>
                    <div className="text-slate-400">Carbs</div>
                    <div className="text-amber-400 font-bold">{currentWeek <= 16 ? '303g' : '382g'}</div>
                  </div>
                  <div>
                    <div className="text-slate-400">Fat</div>
                    <div className="text-amber-400 font-bold">{currentWeek <= 16 ? '76.5g' : '84g'}</div>
                  </div>
                </div>
              </div>

              <div className="space-y-2">
                {Object.entries(MEAL_PLAN).map(([key, meal]) => {
                  // Skip non-selected lunch option
                  if ((key === 'lunchCurry' && lunchChoice !== 'curry') ||
                      (key === 'lunchNachos' && lunchChoice !== 'nachos')) {
                    return null;
                  }

                  const today = new Date().toISOString().split('T')[0];
                  const checked = mealChecks[today]?.[key];
                  return (
                    <div key={key} className="flex items-center gap-2 text-sm">
                      <input
                        type="checkbox"
                        checked={checked || false}
                        onChange={(e) => {
                          const newChecks = {
                            ...mealChecks,
                            [today]: {
                              ...mealChecks[today],
                              [key]: e.target.checked
                            }
                          };
                          saveData('mealChecks', newChecks, setMealChecks);
                        }}
                        className="w-4 h-4"
                      />
                      <span className={`flex-1 ${checked ? 'line-through text-slate-500' : 'text-slate-300'}`}>
                        {meal.name} ({meal.time})
                      </span>
                      <span className="text-amber-400 text-xs">{meal.defaultCalories}cal</span>
                    </div>
                  );
                })}
              </div>
              <button
                onClick={() => setActiveTab('meals')}
                className="w-full mt-3 bg-slate-700 text-slate-300 py-2 rounded text-sm hover:bg-slate-600"
              >
                View Full Meal Plan →
              </button>
            </div>

            {/* Latest Progress */}
            {measurements && measurements.length > 0 && (
              <div className="bg-slate-800 rounded-lg p-4 border border-slate-700">
                <h3 className="text-amber-400 font-bold mb-3">LATEST MEASUREMENTS</h3>
                <div className="grid grid-cols-3 gap-3">
                  <div className="text-center">
                    <div className="text-xs text-slate-400">Weight</div>
                    <div className="text-lg font-bold text-white">
                      {measurements[measurements.length - 1].weight}kg
                    </div>
                  </div>
                  <div className="text-center">
                    <div className="text-xs text-slate-400">Waist</div>
                    <div className="text-lg font-bold text-white">
                      {measurements[measurements.length - 1].waist}cm
                    </div>
                  </div>
                  <div className="text-center">
                    <div className="text-xs text-slate-400">Shoulders</div>
                    <div className="text-lg font-bold text-white">
                      {measurements[measurements.length - 1].shoulders}cm
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      // ============================================
      // WORKOUTS TAB
      // ============================================
      
      const WorkoutsTab = () => {
        const [viewMode, setViewMode] = useState('list'); // 'list' or 'workout'
        const [exerciseData, setExerciseData] = useState({});
        const [completedExercises, setCompletedExercises] = useState([]);

        const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];

        useEffect(() => {
          if (viewMode === 'workout' && currentDay && workoutHistory) {
            const today = new Date().toISOString().split('T')[0];
            const key = `${today}-${currentDay}`;
            if (workoutHistory[key]) {
              setExerciseData(workoutHistory[key].exercises || {});
              setCompletedExercises(workoutHistory[key].completed || []);
            } else {
              setExerciseData({});
              setCompletedExercises([]);
            }
          }
        }, [viewMode, currentDay]);

        const handleSetInput = (exerciseIndex, setIndex, field, value) => {
          setExerciseData(prev => ({
            ...prev,
            [exerciseIndex]: {

      // ============================================
      // MEALS TAB (MyFitnessPal Style)
      // ============================================
      
      const MealsTab = () => {
        const today = new Date().toISOString().split('T')[0];
        const todayChecks = (mealChecks && mealChecks[today]) || {};
        
        const [editingItem, setEditingItem] = useState(null);
        const [searchQuery, setSearchQuery] = useState('');
        const [searchAmount, setSearchAmount] = useState('');
        const [searchResults, setSearchResults] = useState(null);
        const [isSearching, setIsSearching] = useState(false);

        // Calculate meal totals
        const calculateMealTotals = (mealKey) => {
          const meal = MEAL_PLAN[mealKey];
          const customized = customizedMeals[mealKey] || {};
          
          // If meal has phase-specific macros (lunch), use those
          if (meal.macros) {
            const phaseKey = currentWeek <= 16 ? 'phase1' : 'phase2';
            const phaseMacros = meal.macros[phaseKey];
            return {
              calories: phaseMacros.cal,
              protein: phaseMacros.protein,
              carbs: phaseMacros.carbs,
              fats: phaseMacros.fat,
              isEstimate: false
            };
          }
          
          let totalCals = 0;
          let totalProtein = 0;
          let totalCarbs = 0;
          let totalFats = 0;
          let hasAnyCustomized = false;

          meal.items.forEach(item => {
            if (customized[item.id]) {
              hasAnyCustomized = true;
              totalCals += customized[item.id].calories || 0;
              totalProtein += customized[item.id].protein || 0;
              totalCarbs += customized[item.id].carbs || 0;
              totalFats += customized[item.id].fats || 0;
            }
          });

          if (!hasAnyCustomized) {
            return { 
              calories: meal.defaultCalories, 
              protein: '?', 
              carbs: '?', 
              fats: '?',
              isEstimate: true 
            };
          }

          return { 
            calories: Math.round(totalCals), 
            protein: Math.round(totalProtein), 
            carbs: Math.round(totalCarbs), 
            fats: Math.round(totalFats),
            isEstimate: false
          };
        };

        // Calculate daily totals
        const calculateDailyTotals = () => {
          let total = { calories: 0, protein: 0, carbs: 0, fats: 0 };

          Object.keys(MEAL_PLAN).forEach(mealKey => {
            // Skip non-selected lunch option
            if ((mealKey === 'lunchCurry' && lunchChoice !== 'curry') ||
                (mealKey === 'lunchNachos' && lunchChoice !== 'nachos')) {
              return;
            }

            if (todayChecks[mealKey]) {
              const mealTotals = calculateMealTotals(mealKey);
              total.calories += mealTotals.calories || 0;
              if (typeof mealTotals.protein === 'number') total.protein += mealTotals.protein;
              if (typeof mealTotals.carbs === 'number') total.carbs += mealTotals.carbs;
              if (typeof mealTotals.fats === 'number') total.fats += mealTotals.fats;
            }
          });

          return total;
        };

        // USDA API Backend URL - UPDATE THIS AFTER YOU DEPLOY!
        const NUTRITION_API_URL = 'https://northman-nutrition-api.vercel.app/api/nutrition';
        
        // Nutrient ID mapping for USDA FoodData Central
        const NUTRIENT_MAP = {
          1008: { name: 'calories', unit: '', label: 'Calories' },
          1003: { name: 'protein', unit: 'g', label: 'Protein' },
          1005: { name: 'carbs', unit: 'g', label: 'Carbs' },
          1004: { name: 'fats', unit: 'g', label: 'Total Fat' },
          1079: { name: 'fiber', unit: 'g', label: 'Fiber' },
          2000: { name: 'sugar', unit: 'g', label: 'Sugars' },
          1258: { name: 'saturatedFat', unit: 'g', label: 'Saturated Fat' },
          1093: { name: 'sodium', unit: 'mg', label: 'Sodium' },
          1087: { name: 'calcium', unit: 'mg', label: 'Calcium' },
          1089: { name: 'iron', unit: 'mg', label: 'Iron' },
          1092: { name: 'zinc', unit: 'mg', label: 'Zinc' },
          1090: { name: 'magnesium', unit: 'mg', label: 'Magnesium' },
          1091: { name: 'phosphorus', unit: 'mg', label: 'Phosphorus' },
          1095: { name: 'potassium', unit: 'mg', label: 'Potassium' },
          1106: { name: 'vitaminA', unit: 'mcg', label: 'Vitamin A' },
          1114: { name: 'vitaminD', unit: 'mcg', label: 'Vitamin D' },
          1109: { name: 'vitaminE', unit: 'mg', label: 'Vitamin E' },
          1183: { name: 'vitaminK', unit: 'mcg', label: 'Vitamin K' },
          1162: { name: 'vitaminC', unit: 'mg', label: 'Vitamin C' },
          1165: { name: 'vitaminB1', unit: 'mg', label: 'Thiamin (B1)' },
          1166: { name: 'vitaminB2', unit: 'mg', label: 'Riboflavin (B2)' },
          1167: { name: 'vitaminB3', unit: 'mg', label: 'Niacin (B3)' },
          1175: { name: 'vitaminB6', unit: 'mg', label: 'Vitamin B6' },
          1177: { name: 'folate', unit: 'mcg', label: 'Folate' },
          1178: { name: 'vitaminB12', unit: 'mcg', label: 'Vitamin B12' }
        };

        // RDI (Recommended Daily Intake) for adult males doing heavy training
        const RDI = {
          calories: 3700, protein: 200, carbs: 400, fats: 100, fiber: 35, sugar: 50,
          saturatedFat: 20, sodium: 2300, calcium: 1000, iron: 18, zinc: 11,
          magnesium: 400, phosphorus: 700, potassium: 3400, vitaminA: 900,
          vitaminD: 15, vitaminE: 15, vitaminK: 120, vitaminC: 90, vitaminB1: 1.2,
          vitaminB2: 1.3, vitaminB3: 16, vitaminB6: 1.7, folate: 400, vitaminB12: 2.4
        };

        // Search nutrition using USDA backend
        const searchNutrition = async () => {
          if (!searchQuery.trim()) {
            alert('Please enter a food item');
            return;
          }

          setIsSearching(true);
          setSearchResults(null);

          try {
            console.log('Searching USDA for:', searchQuery);
            
            const response = await fetch(`${NUTRITION_API_URL}?query=${encodeURIComponent(searchQuery)}`);
            
            if (!response.ok) {
              throw new Error(`API error: ${response.status}`);
            }

            const data = await response.json();
            console.log('USDA Response:', data);

            if (!data.success || !data.foods || data.foods.length === 0) {
              throw new Error('No foods found. Try different search terms.');
            }

            // Show food selection dialog
            const foods = data.foods.slice(0, 5); // Top 5 results
            const foodList = foods.map((f, i) => `${i + 1}. ${f.description}`).join('\n');
            const choice = prompt(`Found ${data.totalHits} foods! Select one:\n\n${foodList}\n\nEnter number (1-5):`);
            
            if (!choice || choice < 1 || choice > 5) {
              setIsSearching(false);
              return;
            }

            const selectedFood = foods[parseInt(choice) - 1];
            console.log('Selected food:', selectedFood);

            // Parse nutrients from USDA format
            const nutrients = parseUSDANutrients(selectedFood, searchAmount);
            
            setSearchResults(nutrients);

          } catch (error) {
            console.error('Search error:', error);
            alert(`❌ Search Failed\n\n${error.message}\n\n✏️ Manual entry form will appear - enter nutrition from package label.`);
            
            // Show manual entry
            setSearchResults({
              food: searchQuery || 'Manual Entry',
              brand: '',
              serving: searchAmount || '100g',
              ...createEmptyNutrients(),
              manual: true
            });
          } finally {
            setIsSearching(false);
          }
        };

        // Parse USDA nutrient data
        const parseUSDANutrients = (food, amount) => {
          const nutrients = createEmptyNutrients();
          nutrients.food = food.description || 'Unknown food';
          nutrients.brand = food.brandOwner || '';
          nutrients.serving = amount || '100g';

          // Calculate multiplier for serving size
          let multiplier = 1;
          if (amount) {
            const match = amount.match(/(\d+\.?\d*)\s*(g|ml|kg|l|oz|cup|tbsp|tsp)?/i);
            if (match) {
              let num = parseFloat(match[1]);
              const unit = (match[2] || 'g').toLowerCase();
              
              // Convert to grams (USDA data is per 100g)
              if (unit === 'kg') num *= 1000;
              else if (unit === 'l') num *= 1000;
              else if (unit === 'oz') num *= 28.35;
              else if (unit === 'cup') num *= 240;
              else if (unit === 'tbsp') num *= 15;
              else if (unit === 'tsp') num *= 5;
              
              multiplier = num / 100;
            }
          }

          // Extract nutrients from USDA response
          if (food.foodNutrients && Array.isArray(food.foodNutrients)) {
            food.foodNutrients.forEach(nutrient => {
              const mapped = NUTRIENT_MAP[nutrient.nutrientId];
              if (mapped && nutrient.value) {
                const value = nutrient.value * multiplier;
                nutrients[mapped.name] = Math.round(value * 10) / 10;
              }
            });
          }

          return nutrients;
        };

        // Create empty nutrient object
        const createEmptyNutrients = () => ({
          food: '', brand: '', serving: '',
          calories: 0, protein: 0, carbs: 0, fats: 0, fiber: 0, sugar: 0,
          saturatedFat: 0, sodium: 0, calcium: 0, iron: 0, zinc: 0,
          magnesium: 0, phosphorus: 0, potassium: 0, vitaminA: 0,
          vitaminD: 0, vitaminE: 0, vitaminK: 0, vitaminC: 0, vitaminB1: 0,
          vitaminB2: 0, vitaminB3: 0, vitaminB6: 0, folate: 0, vitaminB12: 0
        });
        // Save customized item
        const saveCustomizedItem = () => {
          if (!searchResults || !editingItem) return;

          const { mealKey, itemId } = editingItem;
          
          const newCustomized = {
            ...customizedMeals,
            [mealKey]: {
              ...customizedMeals[mealKey],
              [itemId]: {
                ...searchResults,
                customizedAt: new Date().toISOString()
              }
            }
          };

          setCustomizedMeals(newCustomized);
          storage.set('customizedMeals', newCustomized);

          setEditingItem(null);
          setSearchQuery('');
          setSearchAmount('');
          setSearchResults(null);
        };

        // Remove customization
        const removeCustomization = (mealKey, itemId) => {
          const newCustomized = { ...customizedMeals };
          if (newCustomized[mealKey]) {
            delete newCustomized[mealKey][itemId];
            if (Object.keys(newCustomized[mealKey]).length === 0) {
              delete newCustomized[mealKey];
            }
          }

          setCustomizedMeals(newCustomized);
          storage.set('customizedMeals', newCustomized);
        };

        // Toggle meal check
        const toggleMealCheck = async (mealKey) => {
          const actualMealKey = (mealKey === 'lunchCurry' || mealKey === 'lunchNachos') 
            ? (lunchChoice === 'curry' ? 'lunchCurry' : 'lunchNachos')
            : mealKey;
          
          const newChecks = {
            ...mealChecks,
            [today]: {
              ...todayChecks,
              [actualMealKey]: !todayChecks[actualMealKey]
            }
          };
          saveData('mealChecks', newChecks, setMealChecks);
        };

        const dailyTotals = calculateDailyTotals();

        return (
          <div className="p-4 space-y-4 pb-20">
            {/* Header */}
            <div className="bg-slate-800 rounded-lg p-4 text-center">
              <h2 className="viking-title text-2xl font-bold text-amber-400 mb-1">
                WARRIOR FUEL
              </h2>
              <p className="text-slate-400 text-sm mb-3">Track Your Exact Brands</p>
              
              {/* Daily Totals vs Targets */}
              <div className="bg-slate-900 rounded-lg p-3">
                <div className="flex justify-between items-center mb-3">
                  <div>
                    <div className="text-3xl font-bold text-white">{dailyTotals.calories}</div>
                    <div className="text-xs text-slate-400">/ {currentWeek <= 16 ? '2,860' : '3,385'} cal</div>
                  </div>
                  <div className="text-right">
                    <div className="text-xs text-slate-400 mb-1">{currentWeek <= 16 ? '⚔️ PHASE 1' : '💪 PHASE 2'}</div>
                    <div className="text-xs text-amber-400 font-bold">
                      {Math.round((dailyTotals.calories / (currentWeek <= 16 ? 2860 : 3385)) * 100)}% done
                    </div>
                  </div>
                </div>
                <div className="grid grid-cols-3 gap-2 text-xs">
                  <div>
                    <span className="text-slate-500">P:</span> <span className="text-white font-bold">{dailyTotals.protein}g</span>
                    <div className="text-slate-600 text-xs">/ {currentWeek <= 16 ? '230g' : '240g'}</div>
                  </div>
                  <div>
                    <span className="text-slate-500">C:</span> <span className="text-white font-bold">{dailyTotals.carbs}g</span>
                    <div className="text-slate-600 text-xs">/ {currentWeek <= 16 ? '303g' : '382g'}</div>
                  </div>
                  <div>
                    <span className="text-slate-500">F:</span> <span className="text-white font-bold">{dailyTotals.fats}g</span>
                    <div className="text-slate-600 text-xs">/ {currentWeek <= 16 ? '76.5g' : '84g'}</div>
                  </div>
                </div>
              </div>
            </div>

            {/* Meals */}
            {Object.entries(MEAL_PLAN).map(([mealKey, meal]) => {
              // Skip rendering the non-selected lunch option
              if ((mealKey === 'lunchCurry' && lunchChoice !== 'curry') ||
                  (mealKey === 'lunchNachos' && lunchChoice !== 'nachos')) {
                return null;
              }

              const isChecked = todayChecks[mealKey] || todayChecks[(lunchChoice === 'curry' ? 'lunchCurry' : 'lunchNachos')];
              const mealTotals = calculateMealTotals(mealKey);
              const customized = customizedMeals[mealKey] || {};
              
              // Get phase-specific macros for lunch
              let displayMacros = null;
              if (meal.macros) {
                const phaseKey = currentWeek <= 16 ? 'phase1' : 'phase2';
                displayMacros = meal.macros[phaseKey];
              }

              return (
                <div key={mealKey} className="bg-slate-800 rounded-lg p-4 border border-slate-700">
                  {/* Lunch Tab Switcher */}
                  {(mealKey === 'lunchCurry') && (
                    <div className="mb-3 flex gap-2">
                      <button
                        onClick={() => setLunchChoice('curry')}
                        className={`flex-1 py-2 px-3 rounded text-sm font-bold transition ${
                          lunchChoice === 'curry'
                            ? 'bg-amber-600 text-white'
                            : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                        }`}
                      >
                        🍛 Curry
                      </button>
                      <button
                        onClick={() => setLunchChoice('nachos')}
                        className={`flex-1 py-2 px-3 rounded text-sm font-bold transition ${
                          lunchChoice === 'nachos'
                            ? 'bg-amber-600 text-white'
                            : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                        }`}
                      >
                        🌮 Nachos
                      </button>
                    </div>
                  )}

                  {/* Meal Header */}
                  <div className="flex items-center gap-3 mb-3">
                    <button
                      onClick={() => toggleMealCheck(mealKey)}
                      className={`w-6 h-6 rounded border-2 flex items-center justify-center ${
                        isChecked ? 'bg-amber-600 border-amber-600 text-white' : 'border-slate-600'
                      }`}
                    >
                      {isChecked && '✓'}
                    </button>
                    <div className="flex-1">
                      <h3 className="font-bold text-white">{meal.name}</h3>
                      <div className="text-xs text-slate-400">🕐 {meal.time}</div>
                    </div>
                    <div className="text-right">
                      {displayMacros ? (
                        <>
                          <div className="text-amber-400 font-bold">{displayMacros.cal} cal</div>
                          <div className="text-xs text-slate-300">
                            P:{Math.round(displayMacros.protein)}g C:{Math.round(displayMacros.carbs)}g F:{Math.round(displayMacros.fat)}g
                          </div>
                        </>
                      ) : (
                        <>
                          <div className="text-amber-400 font-bold">{mealTotals.calories} cal</div>
                          {!mealTotals.isEstimate && (
                            <div className="text-xs text-slate-400">
                              P:{mealTotals.protein} C:{mealTotals.carbs} F:{mealTotals.fats}
                            </div>
                          )}
                          {mealTotals.isEstimate && (
                            <div className="text-xs text-amber-600">estimate</div>
                          )}
                        </>
                      )}
                    </div>
                  </div>

                  {/* Food Items */}
                  <div className="space-y-2">
                    {meal.items.map(item => {
                      const customItem = customized[item.id];
                      const isEditing = editingItem?.mealKey === mealKey && editingItem?.itemId === item.id;

                      return (
                        <div key={item.id} className="bg-slate-900 rounded p-2">
                          {!customItem && !isEditing && (
                            <div className="flex items-center justify-between">
                              <div className="flex-1">
                                <div className="text-sm text-slate-400">{item.name}</div>
                                <div className="text-xs text-slate-500">{item.amount}</div>
                              </div>
                              <button
                                onClick={() => {
                                  setEditingItem({ mealKey, itemId: item.id });
                                  setSearchQuery(item.name);
                                  setSearchAmount(item.amount);
                                }}
                                className="text-xs text-amber-400 hover:text-amber-300"
                              >
                                + Add Brand
                              </button>
                            </div>
                          )}

                          {customItem && !isEditing && (
                            <div className="flex items-start justify-between">
                              <div className="flex-1">
                                <div className="text-sm text-white font-semibold">{customItem.food}</div>
                                {customItem.brand && (
                                  <div className="text-xs text-amber-400">{customItem.brand}</div>
                                )}
                                <div className="text-xs text-slate-500">{customItem.serving}</div>
                                <div className="text-xs text-slate-400 mt-1">
                                  {customItem.calories}cal • P:{customItem.protein}g C:{customItem.carbs}g F:{customItem.fats}g
                                </div>
                              </div>
                              <div className="flex gap-2">
                                <button
                                  onClick={() => {
                                    setEditingItem({ mealKey, itemId: item.id });
                                    setSearchQuery(customItem.food);
                                    setSearchAmount(customItem.serving);
                                  }}
                                  className="text-xs text-blue-400"
                                >
                                  Edit
                                </button>
                                <button
                                  onClick={() => removeCustomization(mealKey, item.id)}
                                  className="text-xs text-red-400"
                                >
                                  Remove
                                </button>
                              </div>
                            </div>
                          )}

                          {isEditing && (
                            <div className="space-y-2 pt-2">
                              <div className="text-xs bg-amber-600/20 border border-amber-600/30 p-2 rounded">
                                <strong>⚡ FASTEST:</strong> Just type the food name and hit Search - if it fails, manual entry form appears automatically. Enter macros from the package label.
                              </div>
                              
                              <input
                                type="text"
                                placeholder="Food name (e.g., Greek Yogurt)"
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white text-sm"
                              />
                              <input
                                type="text"
                                placeholder="Amount (e.g., 3 eggs, 200ml, 100g)"
                                value={searchAmount}
                                onChange={(e) => setSearchAmount(e.target.value)}
                                className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-white text-sm"
                              />

                              <div className="flex gap-2">
                                <button
                                  onClick={searchNutrition}
                                  disabled={isSearching}
                                  className="flex-1 bg-amber-600 text-white py-2 rounded text-sm font-semibold disabled:bg-slate-600"
                                >
                                  {isSearching ? '🔍 Searching...' : '🔍 Search Database'}
                                </button>
                                <button
                                  onClick={() => {
                                    setEditingItem(null);
                                    setSearchQuery('');
                                    setSearchAmount('');
                                    setSearchResults(null);
                                  }}
                                  className="bg-slate-700 text-white px-4 py-2 rounded text-sm"
                                >
                                  Cancel
                                </button>
                              </div>

                              {searchResults && (
                                <div className="mt-2 p-3 bg-slate-800 rounded border border-amber-600/30">
                                  {searchResults.manual ? (
                                    <>
                                      <div className="text-xs text-amber-400 mb-2">Manual Entry Mode</div>
                                      <input
                                        type="text"
                                        placeholder="Food name"
                                        value={searchResults.food}
                                        onChange={(e) => setSearchResults({...searchResults, food: e.target.value})}
                                        className="w-full bg-slate-900 border border-slate-600 rounded px-2 py-1 text-white text-sm mb-2"
                                      />
                                      <input
                                        type="text"
                                        placeholder="Brand (optional)"
                                        value={searchResults.brand}
                                        onChange={(e) => setSearchResults({...searchResults, brand: e.target.value})}
                                        className="w-full bg-slate-900 border border-slate-600 rounded px-2 py-1 text-white text-sm mb-2"
                                      />
                                      <input
                                        type="text"
                                        placeholder="Serving size"
                                        value={searchResults.serving}
                                        onChange={(e) => setSearchResults({...searchResults, serving: e.target.value})}
                                        className="w-full bg-slate-900 border border-slate-600 rounded px-2 py-1 text-white text-sm mb-2"
                                      />
                                      <div className="grid grid-cols-2 gap-2 mb-2 text-xs">
                                        <input
                                          type="number"
                                          placeholder="Calories"
                                          value={searchResults.calories || ''}
                                          onChange={(e) => setSearchResults({...searchResults, calories: parseFloat(e.target.value) || 0})}
                                          className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-white"
                                        />
                                        <input
                                          type="number"
                                          placeholder="Protein (g)"
                                          value={searchResults.protein || ''}
                                          onChange={(e) => setSearchResults({...searchResults, protein: parseFloat(e.target.value) || 0})}
                                          className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-white"
                                        />
                                        <input
                                          type="number"
                                          placeholder="Carbs (g)"
                                          value={searchResults.carbs || ''}
                                          onChange={(e) => setSearchResults({...searchResults, carbs: parseFloat(e.target.value) || 0})}
                                          className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-white"
                                        />
                                        <input
                                          type="number"
                                          placeholder="Fats (g)"
                                          value={searchResults.fats || ''}
                                          onChange={(e) => setSearchResults({...searchResults, fats: parseFloat(e.target.value) || 0})}
                                          className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-white"
                                        />
                                        <input
                                          type="number"
                                          placeholder="Fiber (g)"
                                          value={searchResults.fiber || ''}
                                          onChange={(e) => setSearchResults({...searchResults, fiber: parseFloat(e.target.value) || 0})}
                                          className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-white"
                                        />
                                        <input
                                          type="number"
                                          placeholder="Sugar (g)"
                                          value={searchResults.sugar || ''}
                                          onChange={(e) => setSearchResults({...searchResults, sugar: parseFloat(e.target.value) || 0})}
                                          className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-white"
                                        />
                                        <input
                                          type="number"
                                          placeholder="Sat Fat (g)"
                                          value={searchResults.saturatedFat || ''}
                                          onChange={(e) => setSearchResults({...searchResults, saturatedFat: parseFloat(e.target.value) || 0})}
                                          className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-white"
                                        />
                                        <input
                                          type="number"
                                          placeholder="Sodium (mg)"
                                          value={searchResults.sodium || ''}
                                          onChange={(e) => setSearchResults({...searchResults, sodium: parseFloat(e.target.value) || 0})}
                                          className="bg-slate-900 border border-slate-600 rounded px-2 py-1 text-white"
                                        />
                                      </div>
                                    </>
                                  ) : (
                                    <>
                                      <div className="text-sm font-bold text-white">{searchResults.food}</div>
                                      {searchResults.brand && (
                                        <div className="text-xs text-amber-400 mt-1">{searchResults.brand}</div>
                                      )}
                                      <div className="text-xs text-slate-400 mb-3">Serving: {searchResults.serving}</div>
                                      
                                      <div className="grid grid-cols-2 gap-2 text-xs mb-2">
                                        <div className="bg-slate-900 rounded p-2">
                                          <div className="text-slate-500">Calories</div>
                                          <div className="text-amber-400 font-bold text-lg">{searchResults.calories}</div>
                                        </div>
                                        <div className="bg-slate-900 rounded p-2">
                                          <div className="text-slate-500">Protein</div>
                                          <div className="text-white font-bold text-lg">{searchResults.protein}g</div>
                                        </div>
                                        <div className="bg-slate-900 rounded p-2">
                                          <div className="text-slate-500">Carbs</div>
                                          <div className="text-white font-bold">{searchResults.carbs}g</div>
                                        </div>
                                        <div className="bg-slate-900 rounded p-2">
                                          <div className="text-slate-500">Fats</div>
                                          <div className="text-white font-bold">{searchResults.fats}g</div>
                                        </div>
                                        {searchResults.fiber > 0 && (
                                          <div className="bg-slate-900 rounded p-2">
                                            <div className="text-slate-500">Fiber</div>
                                            <div className="text-white font-bold">{searchResults.fiber}g</div>
                                          </div>
                                        )}
                                        {searchResults.sugar > 0 && (
                                          <div className="bg-slate-900 rounded p-2">
                                            <div className="text-slate-500">Sugar</div>
                                            <div className="text-white font-bold">{searchResults.sugar}g</div>
                                          </div>
                                        )}
                                        {searchResults.saturatedFat > 0 && (
                                          <div className="bg-slate-900 rounded p-2">
                                            <div className="text-slate-500">Sat Fat</div>
                                            <div className="text-white font-bold">{searchResults.saturatedFat}g</div>
                                          </div>
                                        )}
                                        {searchResults.sodium > 0 && (
                                          <div className="bg-slate-900 rounded p-2">
                                            <div className="text-slate-500">Sodium</div>
                                            <div className="text-white font-bold">{searchResults.sodium}mg</div>
                                          </div>
                                        )}
                                      </div>
                                    </>
                                  )}
                                  <button
                                    onClick={saveCustomizedItem}
                                    className="w-full bg-green-600 text-white py-2 rounded text-sm font-semibold"
                                  >
                                    ✓ Save This Item
                                  </button>
                                </div>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}

            {/* Targets */}
            <div className="bg-slate-800 rounded-lg p-4 border border-amber-600/30">
              <h3 className="text-amber-400 font-bold mb-2">⚡ DAILY TARGETS</h3>
              <div className="space-y-1 text-sm text-slate-300">
                <div className="flex justify-between">
                  <span>Calories:</span>
                  <span className="text-amber-400 font-bold">3,500-3,700</span>
                </div>
                <div className="flex justify-between">
                  <span>Protein:</span>
                  <span className="text-amber-400 font-bold">200-220g</span>
                </div>
                <div className="flex justify-between">
                  <span>Carbs:</span>
                  <span className="text-amber-400 font-bold">350-450g</span>
                </div>
                <div className="flex justify-between">
                  <span>Fats:</span>
                  <span className="text-amber-400 font-bold">80-100g</span>
                </div>
              </div>
            </div>
          </div>
        );
      };
      // ============================================
      // BOTTOM NAV
      // ============================================
      
      const BottomNav = () => {
        const tabs = [
          { id: 'home', icon: '🏠', label: 'Home' },
          { id: 'workouts', icon: '⚔️', label: 'Train' },
          { id: 'progress', icon: '📊', label: 'Progress' },
          { id: 'meals', icon: '🍖', label: 'Fuel' },
        ];

        return (
          <div className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t-2 border-amber-600/30">
            <div className="flex">
              {tabs.map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex-1 py-3 text-center ${
                    activeTab === tab.id 
                      ? 'bg-amber-600/20 border-t-2 border-amber-600' 
                      : 'text-slate-500'
                  }`}
                >
                  <div className="text-xl mb-1">{tab.icon}</div>
                  <div className={`text-xs font-semibold ${
                    activeTab === tab.id ? 'text-amber-400' : 'text-slate-400'
                  }`}>
                    {tab.label}
                  </div>
                </button>
              ))}
            </div>
          </div>
        );
      };

      // ============================================
      // RENDER
      // ============================================
      
      return (
        <div className="min-h-screen bg-slate-900">
          {activeTab === 'home' && <HomeTab />}
          {activeTab === 'workouts' && <WorkoutsTab />}
          {activeTab === 'progress' && <ProgressTab />}
          {activeTab === 'meals' && <MealsTab />}
          <BottomNav />
        </div>
      );
    }

    ReactDOM.render(<NorthmanApp />, document.getElementById('root'));
  </script>
</body>
</html>
